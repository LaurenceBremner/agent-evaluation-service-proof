[project]
name = "production-style-agent-evaluation-service"
version = "0.1.0"
description = "Synthetic FastAPI service for deterministic AI workflow evaluation and rollout gate decisions."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
